<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Markdown Editor</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>AI Markdown Editor</h1>
    <div class="controls">
      <button id="auto-btn" title="Toggle auto-rewrite (Cmd/Ctrl+Enter to run manually)">Auto: on</button>
      <span id="status" class="status idle">idle</span>
      <button id="key-btn" title="Set Gemini API key">API key</button>
    </div>
  </header>

  <main>
    <section class="pane">
      <div class="pane-head">
        <span>Your draft</span>
        <div class="btn-group">
          <button data-paste="input">Paste</button>
          <button data-clear="input">Clear</button>
          <button data-copy="input">Copy</button>
        </div>
      </div>
      <textarea id="input" placeholder="Type your rough idea in any language…
The right pane will turn it into a structured prompt (Context / Task / Constraints) you can paste into an AI assistant."></textarea>
    </section>

    <section class="pane">
      <div class="pane-head">
        <span>AI-ready prompt</span>
        <button data-copy="output">Copy</button>
      </div>
      <textarea id="output" readonly placeholder="Rewritten output appears here…"></textarea>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
